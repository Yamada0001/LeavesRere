name: Build and Release

on:
  push:
    branches:
      - dev/26.3
      - master
      - main
  workflow_dispatch:
    inputs:
      skip_release:
        description: "只构建，不创建 Release"
        type: boolean
        default: false
      prerelease:
        description: "把本次 Release 标记为预发布"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "zulu"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          add-job-summary: never
          cache-read-only: false

      - name: Configure Git
        run: |
          git config --global user.email "ci@leavesmc.org"
          git config --global user.name "Leaves CI"

      - name: Apply patches
        run: ./gradlew applyAllPatches

      # --rerun 是必须的：jar 的 MANIFEST 里写了 Instant.now() 生成的 Build-Time，
      # 每次构建字节都不同。若 leavesclip 的 patch target 与 patches.list 记录的
      # outputHash 来自不同批次，运行时会报 "Patch not applied correctly"。
      # 全量重跑保证两者同批次。
      - name: Build leavesclip jar
        run: ./gradlew :leaves-server:createLeavesclipJar --rerun
        env:
          BUILD_NUMBER: ${{ github.run_number }}

      - name: Collect artifact
        id: meta
        run: |
          set -euo pipefail
          mc_version=$(grep -E '^mcVersion=' gradle.properties | cut -d= -f2 | tr -d ' \r')
          short_sha=$(git rev-parse --short=7 HEAD)
          tag="${mc_version}-${GITHUB_RUN_NUMBER}-${short_sha}"
          jar_name="leaves-${mc_version}-${short_sha}.jar"

          built=$(ls -1 leaves-server/build/libs/leaves-leavesclip-*.jar | head -n 1)
          if [ -z "$built" ]; then
            echo "::error::没有找到 leavesclip 产物"
            exit 1
          fi
          cp "$built" "$jar_name"

          {
            echo "tag=$tag"
            echo "jar=$jar_name"
            echo "name=Leaves $tag"
            echo "sha256=$(sha256sum "$jar_name" | cut -d' ' -f1)"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### 提交"
            echo
            git log -1 --pretty='- `%h` %s'
            echo
            echo "### 构建信息"
            echo
            echo "| 项目 | 值 |"
            echo "| --- | --- |"
            echo "| Minecraft | ${mc_version} |"
            echo "| 构建号 | ${GITHUB_RUN_NUMBER} |"
            echo "| 提交 | \`${short_sha}\` |"
            echo "| 分支 | \`${GITHUB_REF_NAME}\` |"
            echo "| Java | 25 |"
            echo
            echo "### 校验"
            echo
            echo '```'
            echo "$(sha256sum "$jar_name")"
            echo '```'
          } > release-notes.md

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.jar }}
          path: ${{ steps.meta.outputs.jar }}
          if-no-files-found: error

      - name: Create Release
        if: github.event_name == 'push' || inputs.skip_release == false
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          body_path: release-notes.md
          files: ${{ steps.meta.outputs.jar }}
          draft: false
          prerelease: ${{ inputs.prerelease == true }}
          make_latest: ${{ inputs.prerelease != true }}
          generate_release_notes: false
